<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FXR Trader</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: radial-gradient(circle at 50% 0%, #16324a 0%, #0b0f14 60%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #fff;
    }
    .wrap {
      min-height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 24px;
      text-align: center;
    }
    .logo {
      width: 72px;
      height: 72px;
      border-radius: 20px;
      background: linear-gradient(135deg, #229ed9, #0d5c8f);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      font-weight: 700;
      margin-bottom: 20px;
      box-shadow: 0 8px 24px rgba(34, 158, 217, 0.35);
    }
    h1 {
      font-size: 22px;
      margin: 0 0 8px;
    }
    p.sub {
      color: #9fb3c2;
      font-size: 15px;
      max-width: 320px;
      line-height: 1.5;
      margin: 0 0 32px;
    }
    .btn {
      background: #229ed9;
      color: #fff;
      border: none;
      padding: 14px 36px;
      border-radius: 999px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(34, 158, 217, 0.4);
    }
    .btn:active { transform: scale(0.97); }
    .blocked {
      color: #9fb3c2;
      font-size: 15px;
      max-width: 300px;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div class="wrap" id="app">
    <p class="blocked">Loading…</p>
  </div>

  <script>
    var CHANNEL = "https://t.me/fxrtrader";
    var tg = window.Telegram && window.Telegram.WebApp;
    var app = document.getElementById("app");

    if (tg && tg.initData) {
      tg.ready();
      tg.expand();
      app.innerHTML =
        '<div class="logo">FX</div>' +
        '<h1>FXR Trader</h1>' +
        '<p class="sub">Tap below to join the channel for live signals and updates.</p>' +
        '<button class="btn" id="joinBtn">Go to Channel</button>';

      document.getElementById("joinBtn").addEventListener("click", function () {
        tg.openTelegramLink(CHANNEL);
      });
    } else {
      app.innerHTML =
        '<p class="blocked">This page can only be opened inside Telegram.</p>';
    }
  </script>
</body>
</html>
